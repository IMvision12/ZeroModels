[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zeromodels"
authors = [{ name = "Gitesh Chawda", email = "gitesh.ch.0912@gmail.com" }]
description = "ZeroModels: Open-source Keras 3 collection of pretrained models"
readme = "README.md"
requires-python = ">=3.11"
keywords = [
    "machine-learning",
    "jax",
    "computer-vision",
    "neural-networks",
    "tensorflow",
    "torch",
    "deep-learning",
    "keras",
    "imagenet",
    "pretrained-weights",
    "convolutional-neural-networks",
    "transfer-learning",
    "python-ml",
    "data-science",
    "ai-research",
    "vision-transformer",
    "image-classification",
    "model-training",
    "pytorch",
]
license = { text = "Apache License 2.0" }
classifiers = [
        'Intended Audience :: Education',
        'Intended Audience :: Science/Research',
        'License :: OSI Approved :: Apache Software License',
        'Programming Language :: Python :: 3.11',
        'Programming Language :: Python :: 3.12',
        'Topic :: Scientific/Engineering',
        'Topic :: Scientific/Engineering :: Artificial Intelligence',
        'Topic :: Software Development',
        'Topic :: Software Development :: Libraries',
        'Topic :: Software Development :: Libraries :: Python Modules',
]
dynamic = ["version"]
dependencies = [
    # 3.15.0 fixes the torch-backend slice_update/scatter_update to index with a
    # tuple (`outputs[tuple(slices)]`); earlier 3.x uses a bare list, which warns
    # under torch and errors/misbehaves under torch 2.9 on every cache write.
    "keras>=3.15.0",
    "huggingface_hub",
    "safetensors",
    "numpy",
    "pillow",
    "matplotlib>=3.8.0",
    "tokenizers",
    "sentencepiece",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-cov",
    "requests",
]
# Conversion-only backends: needed to convert source checkpoints to Keras
# weights (offline scripts + on-the-fly `from_weights("hf:...")` / timm loads),
# never to build or run a model. Install with: pip install zeromodels[conversion]
conversion = [
    "torch>=2.5.0",
    "torchvision>=0.20.0",
    "timm",
    "transformers",
]
# Developer tooling: the pre-commit hooks (ruff lint + format, whitespace/EOF
# fixers). Install with: pip install -e .[dev], then run: pre-commit install
# Keep ruff pinned to the .pre-commit-config.yaml rev so a manual `ruff` run
# matches what the hook enforces.
dev = [
    "pre-commit",
    "ruff==0.16.1",
]

[project.scripts]
zeromodels-test = "tests._test_runner:main"

[project.urls]
homepage = "https://imvision12.github.io/ZeroModels/"
documentation = "https://imvision12.github.io/ZeroModels/"
repository = "https://github.com/IMvision12/ZeroModels.git"

[tool.setuptools.packages]
find = { include = ["zeromodels*"] }

[tool.setuptools.dynamic]
version = { attr = "zeromodels.__version__" }

[tool.coverage.run]
source = ["zeromodels", "tests"]
omit = [
    "zeromodels/models/*/convert_*.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::DeprecationWarning:importlib._bootstrap",
    "ignore:__array__ implementation doesn't accept a copy keyword:DeprecationWarning",
    "ignore:builtin type .* has no __module__ attribute:DeprecationWarning",
    "ignore:You are using a softmax over axis .* of a tensor of shape .* This axis has size 1:UserWarning",
    "ignore:The structure of `inputs` doesn't match the expected structure:UserWarning",
]
markers = [
    "serialization: serialization roundtrip tests",
    "saving: model save/load tests",
    "data_format: channels first/last tests",
    "slow: slow tests excluded from default runs",
    "gpu: tests that require GPU (skipped on CI)",
]
