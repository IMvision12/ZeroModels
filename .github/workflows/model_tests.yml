name: Model tests

# The model, tokenizer and processor suite. It runs:
# - on a pull request, inside the PR's own Tests run (test_code.yml calls this file)
#   once IMvision12 comments /run-tests; see run_tests_command.yml;
# - on a release, after lint;
# - by hand from the Actions tab ("Run workflow"), on the chosen branch.
on:
  release:
    types: [created]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  lint-and-format:
    name: Lint & Format
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install ruff==0.16.1
      - run: ruff check .
      - run: ruff format --check .

  test-code:
    name: Test the code (${{ matrix.backend }} ${{ matrix.shard }})
    needs: [lint-and-format]
    # lint runs here only on a release (pull requests lint in test_code.yml)
    if: always() && !cancelled() && needs.lint-and-format.result != 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      # Shard the model suite BY MODEL across parallel jobs (see the --shard
      # option in tests/conftest.py). torch is fast enough unsharded; the JAX and
      # TF legs trace + XLA-compile every model, so they are split to stay under
      # the per-job time cap. Stacks with the per-model build-once reuse.
      matrix:
        include:
          - { backend: torch, shard: "1/2" }
          - { backend: torch, shard: "2/2" }
          - { backend: tensorflow, shard: "1/3" }
          - { backend: tensorflow, shard: "2/3" }
          - { backend: tensorflow, shard: "3/3" }
          - { backend: jax, shard: "1/4" }
          - { backend: jax, shard: "2/4" }
          - { backend: jax, shard: "3/4" }
          - { backend: jax, shard: "4/4" }
    env:
      KERAS_BACKEND: ${{ matrix.backend }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Cache pip packages
        if: github.event_name == 'release'
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ matrix.backend }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: pip-${{ matrix.backend }}-
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -U "keras>=3.15.0" pytest pytest-cov
          # CPU-only torch wheel: the default PyPI wheel bundles
          # CUDA/Triton which segfaults during `import triton.knobs`
          # on CUDA-less Linux runners (gets pulled in transitively by
          # torchvision -> torch._dynamo).
          pip install --index-url https://download.pytorch.org/whl/cpu \
              "torch>=2.5.0" torchvision
          pip install "jax[cpu]" "tensorflow-cpu>=2.19.0"
          pip install sentencepiece "matplotlib>=3.8.0" pillow
          pip install huggingface_hub safetensors
          pip install "transformers>=5.0.0"
          pip install .
      - name: Run all tests
        run: |
          pytest tests/integration/test_backend_compatibility.py \
                 tests/integration/test_serialization.py \
                 tests/integration/test_model_saving.py \
                 tests/integration/test_data_formats.py \
                 tests/integration/test_auto_registry.py \
                 --shard ${{ matrix.shard }} \
                 -v --durations=20 --cov=zeromodels --cov-append \
                 -m "not slow and not gpu"
      - name: Generate coverage
        run: coverage xml -o coverage.xml
      - name: Upload coverage
        if: github.event_name == 'release'
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          flags: ${{ matrix.backend }}
          fail_ci_if_error: false

  test-tokenizers:
    name: Test tokenizers (vs HF)
    needs: [lint-and-format]
    # lint runs here only on a release (pull requests lint in test_code.yml)
    if: always() && !cancelled() && needs.lint-and-format.result != 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      KERAS_BACKEND: torch
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Cache pip packages
        if: github.event_name == 'release'
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-tokenizers-${{ hashFiles('pyproject.toml') }}
          restore-keys: pip-tokenizers-
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -U "keras>=3.15.0" pytest
          pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.5.0"
          pip install sentencepiece huggingface_hub "matplotlib>=3.8.0" pillow
          pip install "transformers>=5.0.0"
          pip install .
      - name: Run tokenizer parity tests
        run: |
          pytest tests/processors/test_keras_tokenizers_vs_hf.py \
                 -v --durations=20

  test-image-processors:
    name: Test image processors (vs HF, ${{ matrix.backend }})
    needs: [lint-and-format]
    # lint runs here only on a release (pull requests lint in test_code.yml)
    if: always() && !cancelled() && needs.lint-and-format.result != 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        backend: [torch, tensorflow, jax]
    env:
      KERAS_BACKEND: ${{ matrix.backend }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Cache pip packages
        if: github.event_name == 'release'
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ matrix.backend }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: pip-${{ matrix.backend }}-
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -U "keras>=3.15.0" pytest
          pip install --index-url https://download.pytorch.org/whl/cpu \
              "torch>=2.5.0" torchvision
          pip install "jax[cpu]" "tensorflow-cpu>=2.19.0"
          pip install sentencepiece "matplotlib>=3.8.0" pillow
          pip install huggingface_hub safetensors
          pip install "transformers>=5.0.0"
          pip install .
      - name: Run image processor parity tests
        run: |
          pytest tests/processors/test_keras_image_processors_vs_hf.py \
                 -v --durations=20

  test-processors:
    name: Test processors (vs HF, ${{ matrix.backend }})
    needs: [lint-and-format]
    # lint runs here only on a release (pull requests lint in test_code.yml)
    if: always() && !cancelled() && needs.lint-and-format.result != 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        backend: [torch, tensorflow, jax]
    env:
      KERAS_BACKEND: ${{ matrix.backend }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Cache pip packages
        if: github.event_name == 'release'
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ matrix.backend }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: pip-${{ matrix.backend }}-
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -U "keras>=3.15.0" pytest
          pip install --index-url https://download.pytorch.org/whl/cpu \
              "torch>=2.5.0" torchvision
          pip install "jax[cpu]" "tensorflow-cpu>=2.19.0"
          pip install sentencepiece "matplotlib>=3.8.0" pillow
          pip install huggingface_hub safetensors
          pip install "transformers>=5.0.0"
          pip install .
      - name: Run processor parity tests
        run: |
          pytest tests/processors/test_keras_processors_vs_hf.py \
                 -v --durations=20

  all-tests:
    # one result for branch protection; same name as the former summary check
    name: Requested model, tokenizer & processor tests
    needs: [test-code, test-tokenizers, test-image-processors, test-processors]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Check that every test job passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")' > /dev/null
