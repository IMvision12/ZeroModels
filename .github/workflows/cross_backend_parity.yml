name: Cross-backend parity

# Manual only: this suite rebuilds every model once per backend (trace + XLA-compile
# on jax/tf), which is too heavy for every PR. Run it on demand from the Actions tab
# ("Run workflow") when you want to confirm torch / jax / tf still agree -- e.g. before
# a release or after touching a shared layer. Not triggered by pull_request or schedule.
on:
  workflow_dispatch:
    inputs:
      backend:
        description: "Which backend(s) to check"
        type: choice
        default: all
        options: [all, torch, jax, tensorflow]

jobs:
  parity:
    name: Parity (${{ matrix.backend }} ${{ matrix.shard }})
    # Only run the matrix legs matching the chosen backend (all, or a single one).
    if: ${{ inputs.backend == 'all' || matrix.backend == inputs.backend }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Same shard-by-model split as the main suite (tests/conftest.py --shard): torch
      # is fast, jax and tf trace + compile every model so they are split further.
      matrix:
        include:
          - { backend: torch, shard: "1/2" }
          - { backend: torch, shard: "2/2" }
          - { backend: tensorflow, shard: "1/3" }
          - { backend: tensorflow, shard: "2/3" }
          - { backend: tensorflow, shard: "3/3" }
          - { backend: jax, shard: "1/4" }
          - { backend: jax, shard: "2/4" }
          - { backend: jax, shard: "3/4" }
          - { backend: jax, shard: "4/4" }
    env:
      KERAS_BACKEND: ${{ matrix.backend }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ matrix.backend }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: pip-${{ matrix.backend }}-
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -U keras>=3.15.0 pytest
          # CPU-only torch wheel (the default bundles CUDA/Triton which segfaults on
          # CUDA-less Linux runners via torchvision -> torch._dynamo).
          pip install --index-url https://download.pytorch.org/whl/cpu \
              torch>=2.5.0 torchvision
          pip install jax[cpu] tensorflow-cpu>=2.19.0
          pip install sentencepiece matplotlib>=3.8.0 pillow
          pip install huggingface_hub safetensors
          pip install -e .
      - name: Run cross-backend parity
        run: |
          pytest tests/integration/test_cross_backend_parity.py \
                 --shard ${{ matrix.shard }} \
                 -v --durations=20 -m "not slow and not gpu"
